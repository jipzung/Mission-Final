<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My System Diary</title>
<style>
  :root {
    --blue: #4a7bd4;
    --blue-light: #eaf1fb;
    --pastel: #fdf0e9;
    --pastel2: #f7f3ff;
    --gray: #9aa0a6;
    --border: #d7e0ef;
    --text: #333;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", "맑은 고딕", sans-serif;
    background: linear-gradient(135deg, var(--blue-light), var(--pastel));
    color: var(--text);
    min-height: 100vh;
  }
  header {
    text-align: center;
    padding: 16px;
  }
  header h1 {
    margin: 0 0 12px;
    color: var(--blue);
    font-size: 24px;
  }

  /* 상단 탭 */
  .tabs {
    display: inline-flex;
    gap: 6px;
    background: #fff;
    padding: 6px;
    border-radius: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
  }
  .tabs button {
    border: none;
    background: transparent;
    padding: 8px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    color: var(--gray);
  }
  .tabs button.active {
    background: var(--blue);
    color: #fff;
  }

  /* 네비게이션 바 (화살표 + 제목 + 버튼들) */
  .nav-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    max-width: 960px;
    margin: 16px auto 8px;
    padding: 0 12px;
    position: relative;
  }
  .nav-bar .arrow {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 38px; height: 38px;
    font-size: 18px;
    cursor: pointer;
    color: var(--blue);
  }
  .nav-bar .title {
    font-size: 18px;
    font-weight: bold;
    min-width: 220px;
    text-align: center;
  }
  .day-actions {
    position: absolute;
    right: 12px;
    display: flex;
    gap: 8px;
  }
  .day-actions button {
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
    font-size: 14px;
    color: #fff;
  }
  #addBtn { background: var(--blue); }
  #deleteBtn { background: #e57373; }

  /* 공통 영역 */
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 12px;
  }
  .hidden { display: none !important; }

  /* 달력(월간/주간 공통) 테이블 */
  table.calendar {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
    table-layout: fixed;
  }
  table.calendar th {
    background: var(--blue);
    color: #fff;
    padding: 8px 0;
    font-weight: 500;
    font-size: 14px;
  }
  table.calendar th.sun { background:#6f9be0; }
  table.calendar td {
    border: 1px solid var(--border);
    vertical-align: top;
    height: 100px;
    padding: 4px;
    cursor: pointer;
    background: #fff;
  }
  table.calendar td.other-month { background: #f5f6f8; color: #bbb; }
  table.calendar td.today { background: var(--pastel2); }
  .cell-date { font-size: 13px; font-weight: bold; margin-bottom: 2px; }
  .cell-events { font-size: 12px; }

  /* 셀 안 일정 한 줄 표시 + 넘침 자르기 */
  .mini-item {
    display: flex;
    align-items: center;
    gap: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 1px;
  }
  .mini-item span {
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 주간 셀은 좀 더 높게 */
  table.weekly td { height: 300px; }

  /* 완료 상태 */
  .done span, .done .todo-text { color: var(--gray); text-decoration: line-through; }

  /* 일간 리스트 */
  .daily-list {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
    overflow: hidden;
  }
  .daily-head, .daily-row {
    display: flex;
    align-items: center;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
  }
  .daily-head {
    background: var(--blue-light);
    font-weight: bold;
    color: var(--blue);
  }
  .col-done { width: 60px; text-align: center; }
  .col-text { flex: 1; padding: 0 12px; }
  .col-del  { width: 60px; text-align: center; }
  .todo-text { cursor: pointer; }
  .todo-text:hover { background: #f3f7ff; border-radius: 4px; }
  .edit-input {
    width: 100%;
    padding: 4px 6px;
    border: 1px solid var(--blue);
    border-radius: 4px;
    font-size: 14px;
  }
  .empty-msg { padding: 24px; text-align: center; color: var(--gray); }

  /* 모달 */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.35);
    display: flex; align-items: center; justify-content: center;
  }
  .modal {
    background: #fff;
    padding: 24px;
    border-radius: 12px;
    width: 320px;
    box-shadow: 0 6px 20px rgba(0,0,0,.2);
  }
  .modal h3 { margin: 0 0 12px; color: var(--blue); }
  .modal input {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
  }
  .modal .hint { font-size: 12px; color: var(--gray); margin-top: 8px; }
</style>
</head>
<body>
  <header>
    <h1>My System Diary</h1>
    <div class="tabs">
      <button data-view="month" class="active">월간</button>
      <button data-view="week">주간</button>
      <button data-view="day">일간</button>
    </div>
  </header>

  <div class="nav-bar">
    <button class="arrow" id="prevBtn">←</button>
    <div class="title" id="viewTitle"></div>
    <button class="arrow" id="nextBtn">→</button>
    <div class="day-actions hidden" id="dayActions">
      <button id="addBtn">추가</button>
      <button id="deleteBtn">삭제</button>
    </div>
  </div>

  <main>
    <div id="monthView"></div>
    <div id="weekView" class="hidden"></div>
    <div id="dayView" class="hidden"></div>
  </main>

  <!-- 모달은 JS에서 동적으로 삽입 -->

<!-- ↓↓↓ 파트 2, 파트 3 스크립트가 여기에 들어갑니다 ↓↓↓ -->
<script>
/* ===================== 데이터 영역 ===================== */
const STORAGE_KEY = "mySystemDiary";

// { "2026-11-10": [ {id, text, done}, ... ], ... }
let diaryData = loadData();

// 삭제 체크박스 선택 상태는 저장하지 않는 임시 상태 (id의 집합)
let deleteSelection = new Set();

// 현재 화면 상태
let currentView = "month";        // month | week | day
let currentDate = new Date();     // 기준 날짜

function loadData() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    return migrate(raw);   // 불러올 때 구조를 표준 형식으로 보정
  } catch (e) {
    return {};
  }
}

/* 기존 데이터를 현재 표준 구조로 변환
   - 항목이 문자열이면 객체로 변환
   - id 없으면 생성
   - done 없으면 false
*/
function migrate(data) {
  let changed = false;

  Object.keys(data).forEach(key => {
    const list = data[key];

    // 값이 배열이 아니면 빈 배열로 정리
    if (!Array.isArray(list)) {
      data[key] = [];
      changed = true;
      return;
    }

    data[key] = list.map(item => {
      // 1) 문자열이면 객체로
      if (typeof item === "string") {
        changed = true;
        return { id: makeId(), text: item, done: false };
      }

      // 2) 객체지만 필드가 빠진 경우 보정
      if (item && typeof item === "object") {
        const fixed = { ...item };
        if (!fixed.id) { fixed.id = makeId(); changed = true; }
        if (typeof fixed.done !== "boolean") { fixed.done = false; changed = true; }
        if (typeof fixed.text !== "string") { fixed.text = String(fixed.text ?? ""); changed = true; }
        return fixed;
      }

      // 3) 알 수 없는 형태 → 안전하게 빈 항목
      changed = true;
      return { id: makeId(), text: "", done: false };
    });
  });

  // 변환이 있었으면 즉시 저장해서 다음부터는 깨끗한 구조 유지
  if (changed) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }
  return data;
}function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(diaryData));
}

/* ===================== 날짜 유틸 ===================== */
// Date -> "2026-11-10" 형식의 키
function toKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

// 같은 날짜인지 비교
function isSameDate(a, b) {
  return a.getFullYear() === b.getFullYear()
      && a.getMonth() === b.getMonth()
      && a.getDate() === b.getDate();
}

const WEEK_LABELS = ["일", "월", "화", "수", "목", "금", "토"];

// "2026년 11월 10일 화요일" 형식
function formatKorean(date) {
  const y = date.getFullYear();
  const m = date.getMonth() + 1;
  const d = date.getDate();
  const w = WEEK_LABELS[date.getDay()];
  return `${y}년 ${m}월 ${d}일 ${w}요일`;
}

// 특정 날짜의 일정 배열 가져오기 (없으면 빈 배열)
function getEvents(date) {
  return diaryData[toKey(date)] || [];
}

// 고유 id 생성
function makeId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

/* ===================== 렌더링: 공통 진입점 ===================== */
function render() {
  // 탭 활성화 표시
  document.querySelectorAll(".tabs button").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.view === currentView);
  });

  // 화면 표시/숨김
  document.getElementById("monthView").classList.toggle("hidden", currentView !== "month");
  document.getElementById("weekView").classList.toggle("hidden", currentView !== "week");
  document.getElementById("dayView").classList.toggle("hidden", currentView !== "day");

  // 추가/삭제 버튼은 일간 화면에서만
  document.getElementById("dayActions").classList.toggle("hidden", currentView !== "day");

  if (currentView === "month") renderMonth();
  else if (currentView === "week") renderWeek();
  else renderDay();
}

/* ===================== 렌더링: 월간 ===================== */
function renderMonth() {
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();

  document.getElementById("viewTitle").textContent = `${year}년 ${month + 1}월`;

  // 이번 달 1일과 마지막 날
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);

  // 달력 시작점: 1일이 포함된 주의 일요일
  const startDate = new Date(firstDay);
  startDate.setDate(firstDay.getDate() - firstDay.getDay());

  // 요일 헤더
  let html = '<table class="calendar"><thead><tr>';
  WEEK_LABELS.forEach((w, i) => {
    html += `<th class="${i === 0 ? "sun" : ""}">${w}</th>`;
  });
  html += "</tr></thead><tbody>";

  const today = new Date();
  let cursor = new Date(startDate);

  // 6주(42칸) 기준으로 그리되, 마지막 날을 넘기고 주가 끝나면 종료
  while (cursor <= lastDay || cursor.getDay() !== 0) {
    if (cursor.getDay() === 0) html += "<tr>";

    const inMonth = cursor.getMonth() === month;
    const key = toKey(cursor);
    const classes = [];
    if (!inMonth) classes.push("other-month");
    if (isSameDate(cursor, today)) classes.push("today");

    html += `<td class="${classes.join(" ")}" data-date="${key}">`;
    html += `<div class="cell-date">${cursor.getDate()}</div>`;
    html += `<div class="cell-events">${renderMiniEvents(key)}</div>`;
    html += "</td>";

    if (cursor.getDay() === 6) html += "</tr>";
    cursor.setDate(cursor.getDate() + 1);
  }

  html += "</tbody></table>";
  document.getElementById("monthView").innerHTML = html;
}

/* ===================== 렌더링: 주간 ===================== */
function renderWeek() {
  // 현재 날짜가 포함된 주의 일요일
  const start = new Date(currentDate);
  start.setDate(currentDate.getDate() - currentDate.getDay());

  const end = new Date(start);
  end.setDate(start.getDate() + 6);

  document.getElementById("viewTitle").textContent =
    `${start.getMonth() + 1}월 ${start.getDate()}일 ~ ${end.getMonth() + 1}월 ${end.getDate()}일`;

  let html = '<table class="calendar weekly"><thead><tr>';
  for (let i = 0; i < 7; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    html += `<th class="${i === 0 ? "sun" : ""}">${WEEK_LABELS[i]} (${d.getDate()})</th>`;
  }
  html += "</tr></thead><tbody><tr>";

  const today = new Date();
  for (let i = 0; i < 7; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    const key = toKey(d);
    const todayClass = isSameDate(d, today) ? "today" : "";
    html += `<td class="${todayClass}" data-date="${key}">`;
    html += `<div class="cell-events">${renderMiniEvents(key)}</div>`;
    html += "</td>";
  }

  html += "</tr></tbody></table>";
  document.getElementById("weekView").innerHTML = html;
}

// 월간/주간 셀 안에 들어갈 미니 일정 목록 (체크박스 + 한 줄 텍스트)
function renderMiniEvents(key) {
  const events = diaryData[key] || [];
  return events.map(ev => `
    <div class="mini-item ${ev.done ? "done" : ""}">
      <input type="checkbox" class="mini-check" data-key="${key}" data-id="${ev.id}" ${ev.done ? "checked" : ""}/>
      <span>${escapeHtml(ev.text)}</span>
    </div>
  `).join("");
}

/* ===================== 렌더링: 일간 ===================== */
function renderDay() {
  document.getElementById("viewTitle").textContent = formatKorean(currentDate);

  const key = toKey(currentDate);
  const events = diaryData[key] || [];

  let html = '<div class="daily-list">';
  html += `
    <div class="daily-head">
      <div class="col-done">완료</div>
      <div class="col-text">할 일</div>
      <div class="col-del">삭제</div>
    </div>`;

  if (events.length === 0) {
    html += '<div class="empty-msg">등록된 일정이 없습니다.</div>';
  } else {
    events.forEach(ev => {
      html += `
        <div class="daily-row ${ev.done ? "done" : ""}" data-id="${ev.id}">
          <div class="col-done">
            <input type="checkbox" class="day-check" data-id="${ev.id}" ${ev.done ? "checked" : ""}/>
          </div>
          <div class="col-text">
            <span class="todo-text" data-id="${ev.id}">${escapeHtml(ev.text)}</span>
          </div>
          <div class="col-del">
            <input type="checkbox" class="del-check" data-id="${ev.id}" ${deleteSelection.has(ev.id) ? "checked" : ""}/>
          </div>
        </div>`;
    });
  }

  html += "</div>";
  document.getElementById("dayView").innerHTML = html;
}

/* ===================== 보조: HTML 이스케이프 ===================== */
// 사용자가 입력한 텍스트를 안전하게 표시 (태그 삽입 방지)
function escapeHtml(str) {
  return str
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
</script>

<script>
/* ===================== 탭 전환 ===================== */
document.querySelectorAll(".tabs button").forEach(btn => {
  btn.addEventListener("click", () => {
    currentView = btn.dataset.view;
    deleteSelection.clear();   // 화면 전환 시 삭제 선택 초기화
    render();
  });
});

/* ===================== 이전/다음 화살표 ===================== */
document.getElementById("prevBtn").addEventListener("click", () => moveDate(-1));
document.getElementById("nextBtn").addEventListener("click", () => moveDate(1));

// 키보드 방향키 (←, →)
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return; // 입력 중엔 이동 금지
  if (e.key === "ArrowLeft") moveDate(-1);
  if (e.key === "ArrowRight") moveDate(1);
});

function moveDate(dir) {
  const d = new Date(currentDate);
  if (currentView === "month") d.setMonth(d.getMonth() + dir);
  else if (currentView === "week") d.setDate(d.getDate() + dir * 7);
  else d.setDate(d.getDate() + dir);
  currentDate = d;
  deleteSelection.clear();     // 날짜 이동 시 삭제 선택 초기화
  render();
}

/* ===================== 월간/주간 셀 클릭 & 미니 체크박스 ===================== */
["monthView", "weekView"].forEach(id => {
  document.getElementById(id).addEventListener("click", (e) => {
    // 완료 체크박스 → 완료 토글만, 일간 이동 안 함
    if (e.target.classList.contains("mini-check")) {
      e.stopPropagation();
      toggleDone(e.target.dataset.key, e.target.dataset.id);
      return;
    }
    // 날짜 칸 클릭 → 일간 화면 이동
    const cell = e.target.closest("td[data-date]");
    if (cell) {
      currentDate = keyToDate(cell.dataset.date);
      currentView = "day";
      deleteSelection.clear();
      render();
    }
  });
});

function keyToDate(key) {
  const [y, m, d] = key.split("-").map(Number);
  return new Date(y, m - 1, d);
}

/* ===================== 완료 토글 (월·주·일 공통) =====================
   요청 1: 체크 ↔ 해제 토글 (done 값을 반전 → 다시 누르면 원래대로)
   요청 2: 저장된 done 기준으로 render() → 모든 화면에 동일 반영
   요청 3: saveData()로 localStorage 저장
================================================================= */
function toggleDone(key, id) {
  const events = diaryData[key];
  if (!events) return;
  const ev = events.find(e => e.id === id);
  if (!ev) return;
  ev.done = !ev.done;   // true ↔ false 토글
  saveData();           // 완료 여부 저장
  render();             // 월/주/일 모두 다시 그려 동일 반영
}

/* ===================== 일간 화면 이벤트 ===================== */
const dayView = document.getElementById("dayView");

dayView.addEventListener("change", (e) => {
  const key = toKey(currentDate);

  // 완료 체크박스
  if (e.target.classList.contains("day-check")) {
    toggleDone(key, e.target.dataset.id);
  }

  // 삭제 체크박스 → 임시 선택 상태(Set)에만 반영 (저장 안 함)
  if (e.target.classList.contains("del-check")) {
    const id = e.target.dataset.id;
    if (e.target.checked) deleteSelection.add(id);
    else deleteSelection.delete(id);
  }
});

// 할 일 내용 클릭 → 인라인 수정
dayView.addEventListener("click", (e) => {
  if (e.target.classList.contains("todo-text")) startEdit(e.target);
});

function startEdit(span) {
  const id = span.dataset.id;
  const key = toKey(currentDate);
  const ev = (diaryData[key] || []).find(e => e.id === id);
  if (!ev) return;

  const input = document.createElement("input");
  input.type = "text";
  input.className = "edit-input";
  input.value = ev.text;
  span.replaceWith(input);
  input.focus();

  let finished = false;
  const save = () => {
    if (finished) return;
    finished = true;
    const newText = input.value.trim();
    if (newText !== "") { ev.text = newText; saveData(); } // 빈 값이면 기존 유지
    render();
  };

  input.addEventListener("keydown", (ev2) => { if (ev2.key === "Enter") save(); });
  input.addEventListener("blur", save);
}

/* ===================== 일정 추가 (모달) ===================== */
document.getElementById("addBtn").addEventListener("click", openAddModal);

function openAddModal() {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal">
      <h3>할 일 추가</h3>
      <input type="text" id="modalInput" placeholder="할 일 내용을 입력하세요" />
      <div class="hint">입력 후 Enter 키를 누르면 추가됩니다. (빈 칸이면 추가 안 됨)</div>
    </div>`;
  document.body.appendChild(overlay);

  const input = overlay.querySelector("#modalInput");
  input.focus();

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { addEvent(input.value); closeModal(overlay); }
  });
  overlay.addEventListener("click", (e) => {
    if (e.target === overlay) closeModal(overlay);
  });
}

function closeModal(overlay) { overlay.remove(); }

function addEvent(text) {
  const trimmed = text.trim();
  if (trimmed === "") return;
  const key = toKey(currentDate);
  if (!diaryData[key]) diaryData[key] = [];
  diaryData[key].push({ id: makeId(), text: trimmed, done: false });
  saveData();
  render();
}

/* ===================== 삭제 =====================
   요청 4 수정: 기존의 "render 재정의 블록" 제거.
   그 블록이 const로 render를 재할당하려다 오류를 내서
   삭제 후 화면 갱신이 멈추는(=삭제 안 되는 것처럼 보이는) 버그였음.
================================================================= */
document.getElementById("deleteBtn").addEventListener("click", () => {
  if (deleteSelection.size === 0) {
    alert("삭제할 일정을 먼저 체크해 주세요.");
    return;
  }

  const ok = confirm("선택한 일정을 정말 삭제하시겠습니까?");
  if (!ok) return;

  const key = toKey(currentDate);
  if (diaryData[key]) {
    // 선택(deleteSelection)에 포함되지 않은 것만 남김
    diaryData[key] = diaryData[key].filter(ev => !deleteSelection.has(ev.id));
    if (diaryData[key].length === 0) delete diaryData[key];
    saveData();
  }
  deleteSelection.clear();  // 임시 선택 초기화
  render();                 // 삭제 결과 화면에 반영
});

/* ===================== 초기 실행 ===================== */
render();
</script>
</body>
</html>
